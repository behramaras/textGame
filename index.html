<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/textgame.css">
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet">
    <title>Behram's Interactive Fiction</title>
  </head>
  <body>
    <header id="top-bar">
      <div id="weather-widget" class="weather" aria-live="polite">
        <svg id="weather-icon" width="20" height="14" viewBox="0 0 20 14" fill="currentColor" aria-hidden="true" style="vertical-align: middle; margin-right: 6px;">
          <path d="M16 6.5a3.5 3.5 0 00-3.5-3.5 3.48 3.48 0 00-2.5 1.06A4 4 0 102 10h13a3 3 0 001-5.82V6.5z"/>
        </svg>
        <span id="weather-text">Loading weather...</span>
      </div>
      <button id="theme-toggle" type="button" aria-label="Toggle dark and light theme">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </header>

    <main id="terminal">
      <div id="output"></div>

      <div id="input-line">
        <span class="prompt">$></span>
        <input
          type="text"
          id="input"
          placeholder="Enter your answer..."
          aria-label="Enter a game command">
      </div>
    </main>

    <script src="assets/js/textgame.js"></script>
  </body>
</html>
